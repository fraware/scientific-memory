[project]
name = "sm-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8",
  "jsonschema>=4.23",
  "referencing>=0.35",
  "typer>=0.12",
  "rich>=13.7",
  "networkx>=3.3",
  "httpx>=0.27",
  "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
# Install when pcs-core is available: uv sync --project pipeline --extra pcs
pcs = ["pcs-core>=0.1.0"]

[tool.uv.sources]
# Sibling checkout: <parent>/pcs-core. CI: clone into scientific-memory/pcs-core.
pcs-core = { path = "../../pcs-core/python", editable = true }

[project.scripts]
sm-pipeline = "sm_pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sm_pipeline"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "../tests/pcs"]

[tool.ruff]
line-length = 100
