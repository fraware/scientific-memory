# Monthly contributor dry-run (optional; cost-aware). SPEC Milestone 5.
name: Contributor dry-run (monthly)
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pcs-core (workspace dependency)
        uses: actions/checkout@v4
        with:
          repository: SentinelOps-CI/pcs-core
          path: pcs-core

      - name: Make PCS dependency available at uv.lock sibling path
        run: |
          test -f "$GITHUB_WORKSPACE/pcs-core/python/pyproject.toml"
          ln -sfn "$GITHUB_WORKSPACE/pcs-core" "$GITHUB_WORKSPACE/../pcs-core"
      - uses: astral-sh/setup-uv@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10.0.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install elan for Lean build
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install Python deps
        run: uv sync --all-packages
      - name: Install portal deps
        run: pnpm --dir portal install --frozen-lockfile
      - name: Validate corpus
        run: uv run --project pipeline python -m sm_pipeline.cli validate-all
      - name: Pipeline tests
        run: uv run --project pipeline pytest
      - name: Kernel tests
        run: uv run --project kernels/adsorption pytest
      - name: Lean build
        run: lake build
      - name: Portal build
        run: pnpm --dir portal build
      - name: Benchmark regression
        run: uv run --project pipeline python -m sm_pipeline.cli benchmark
