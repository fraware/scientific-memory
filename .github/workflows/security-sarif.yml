name: security-sarif

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  ruff-sarif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pcs-core (workspace dependency)
        uses: actions/checkout@v4
        with:
          repository: SentinelOps-CI/pcs-core
          ref: 9c971f5f9da8a424924dd8f48d6a3b71a1009e1b
          path: pcs-core

      - name: Make PCS dependency available at uv.lock sibling path
        run: |
          test -f "$GITHUB_WORKSPACE/pcs-core/python/pyproject.toml"
          ln -sfn "$GITHUB_WORKSPACE/pcs-core" "$GITHUB_WORKSPACE/../pcs-core"

      - name: Verify pinned PCS revision and repair upstream packaging metadata
        run: python scripts/prepare_pcs_core_workspace.py
      - uses: astral-sh/setup-uv@v4
      - name: Install Python deps
        run: uv sync --all-packages
      - name: Generate Ruff SARIF (warning-first)
        run: |
          uvx --from ruff==0.17.0 ruff check pipeline kernels kernels/conformance scripts tests --output-format sarif --exit-zero > ruff.sarif
      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ruff.sarif
