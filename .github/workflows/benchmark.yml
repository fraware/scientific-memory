name: benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pcs-core (workspace dependency)
        uses: actions/checkout@v4
        with:
          repository: SentinelOps-CI/pcs-core
          ref: 9c971f5f9da8a424924dd8f48d6a3b71a1009e1b
          path: pcs-core

      - name: Make PCS dependency available at uv.lock sibling path
        run: |
          test -f "$GITHUB_WORKSPACE/pcs-core/python/pyproject.toml"
          ln -sfn "$GITHUB_WORKSPACE/pcs-core" "$GITHUB_WORKSPACE/../pcs-core"

      - name: Verify pinned PCS revision and repair upstream packaging metadata
        run: python scripts/prepare_pcs_core_workspace.py

      - uses: astral-sh/setup-uv@v4

      - name: Install deps
        run: uv sync --all-packages

      - name: Run benchmark suite
        run: uv run --project pipeline python -m sm_pipeline.cli benchmark

      - name: Proof success and trend summary (Gate 6)
        run: |
          if [ -f benchmarks/reports/proof_success_summary.md ]; then cat benchmarks/reports/proof_success_summary.md; fi
          if [ -f benchmarks/reports/trend/proof_success_history.json ]; then echo "Trend history: benchmarks/reports/trend/proof_success_history.json"; fi

      - name: Upload benchmark reports
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: benchmarks/reports/
